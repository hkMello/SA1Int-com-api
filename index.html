<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DDA Metalúrgica · Painel de Pastilhas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <h1>DDA Metalúrgica</h1>
    <p>Estoque de pastilhas</p>
  </header>

  <main>
    <p id="status" role="status" hidden></p>

    <section class="painel" aria-labelledby="t-form">
      <h2 id="t-form">Cadastrar pastilha</h2>
      <form id="form-pastilha">
        <input type="hidden" id="id">
        <label>Nome <input id="nome" required></label>
        <label>Código <input id="codigo" required></label>
        <label>Quantidade <input id="quantidade" type="number" min="0" required></label>
        <label>Categoria <input id="categoria" required></label>
        <label>Fornecedor <input id="fornecedor" required></label>
        <label>Preço (R$) <input id="preco" type="number" min="0" step="0.01" required></label>
        <div class="acoes">
          <button type="submit" id="btn-salvar">Cadastrar</button>
          <button type="button" id="btn-cancelar" class="sec" hidden>Cancelar edição</button>
        </div>
      </form>
    </section>

    <section class="painel" aria-labelledby="t-busca">
      <h2 id="t-busca">Buscar por ID</h2>
      <form id="form-busca" class="linha">
        <label>ID <input id="busca-id" type="number" min="1" required></label>
        <button type="submit">Buscar</button>
      </form>
      <div id="detalhe" hidden></div>
    </section>

    <section class="painel" aria-labelledby="t-lista">
      <h2 id="t-lista">Todas as pastilhas</h2>
      <div class="rolagem">
        <table>
          <thead>
            <tr>
              <th>ID</th><th>Nome</th><th>Código</th><th>Qtd.</th>
              <th>Categoria</th><th>Fornecedor</th><th>Preço</th><th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
